[project]
name = "mcp-server-template"
version = "0.1.0"
description = "Template for code-based MCP servers in the LOOP vault."
requires-python = ">=3.11"
dependencies = [
    "mcp>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"