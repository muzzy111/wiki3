[project]
name = "loop-filesystem-mcp"
version = "0.1.0"
description = "Filesystem MCP server exposing read/write/list/search over a vault root"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0,<2.0",
    "PyYAML>=6.0",
    "pydantic>=2.0,<3.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --basetemp=./.pytest-tmp"
