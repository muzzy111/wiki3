[project]
name = "hermes-bus"
version = "0.1.0"
description = "Operates the LOOP vault's agent chat topology on this host."
requires-python = ">=3.10"
dependencies = [
    "watchdog>=4.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
hermes-bus = "hermes_bus.daemon:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --basetemp=./.pytest-tmp"
